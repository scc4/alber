<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; font-family:'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh;
    background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, #050505 70%);
  }
  #root { display:flex; align-items:center; justify-content:center; }
  @keyframes pop { 0% { transform: scale(0.7); opacity:0; } 60% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake { 0%,100% { transform:translateX(0);} 20%,60% { transform:translateX(-6px);} 40%,80% { transform:translateX(6px);} }
  input::placeholder { color: rgba(255,255,255,0.3); }
  /* hide chrome scrollbars in scroll regions */
  *::-webkit-scrollbar { width:0; height:0; }
</style>
